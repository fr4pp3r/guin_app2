<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Verification - Barangay Guion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F5F7FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 20px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 24px; }
    .icon { width: 64px; height: 64px; border-radius: 50%; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .message { color: #666; font-size: 14px; line-height: 1.5; }
    .details { margin-top: 24px; border-top: 1px solid #eee; padding-top: 20px; }
    .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
    .row:last-child { border-bottom: none; }
    .label { color: #888; font-size: 13px; font-weight: 600; }
    .value { color: #333; font-size: 13px; font-weight: 600; text-align: right; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .use-btn { display: block; width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 14px; background: #1976D2; color: white; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .use-btn:hover { background: #1565C0; }
    .use-btn:disabled { background: #ccc; cursor: not-allowed; }
    .footer { text-align: center; margin-top: 20px; color: #999; font-size: 11px; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .error { text-align: center; padding: 40px; color: #D32F2F; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="loading">Loading verification...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://isfzfpowtwcapjshtemd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bKk_5QjFQvut1cYXd1cjbA_cU85frQX';

    const params = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.split('/');
    const documentId = pathParts[pathParts.length - 1] || params.get('documentId');
    const token = params.get('token');

    const app = document.getElementById('app');

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      return new Date(dateStr).toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function sentenceCase(str) {
      if (!str) return 'N/A';
      return str.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
    }

    function evaluateAccess(v) {
      const now = new Date();
      if (v.status === 'revoked') return 'revoked';
      if (v.status === 'used') return 'used';
      if (v.expires_at && now > new Date(v.expires_at)) return 'expired';
      if (v.single_use && (v.use_count || 0) > 0) return 'used';
      if (v.max_uses !== null && v.max_uses !== undefined && (v.use_count || 0) >= v.max_uses) return 'useLimitReached';
      return 'allowed';
    }

    async function loadVerification() {
      if (!documentId) {
        app.innerHTML = '<div class="error">No document ID provided.</div>';
        return;
      }

      try {
        let verification = null;
        let copy = null;

        if (token) {
          // Try parent verification token
          const parentRes = await fetch(
            `${SUPABASE_URL}/rest/v1/document_verifications?document_id=eq.${documentId}&verification_token=eq.${token}&limit=1`,
            { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
          );
          const parentData = await parentRes.json();
          if (parentData && parentData.length > 0) {
            verification = parentData[0];
          } else {
            // Try print copy token
            const copyRes = await fetch(
              `${SUPABASE_URL}/rest/v1/document_print_copies?verification_token=eq.${token}&limit=1`,
              { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
            );
            const copyData = await copyRes.json();
            if (copyData && copyData.length > 0) {
              copy = copyData[0];
              const parentRes2 = await fetch(
                `${SUPABASE_URL}/rest/v1/document_verifications?document_id=eq.${copy.document_id}&limit=1`,
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
              );
              const parentData2 = await parentRes2.json();
              if (parentData2 && parentData2.length > 0) {
                verification = parentData2[0];
              }
            }
          }
        } else {
          // No token: lookup by document ID only
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/document_verifications?document_id=eq.${documentId}&limit=1`,
            { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
          );
          const data = await res.json();
          if (data && data.length > 0) {
            verification = data[0];
          }
        }

        if (!verification) {
          app.innerHTML = '<div class="error"><h2>Verification Failed</h2><p>Document not found or verification token is invalid.</p></div>';
          return;
        }

        renderResult(verification, copy, token);
      } catch (err) {
        app.innerHTML = `<div class="error"><h2>Error</h2><p>${err.message}</p></div>`;
      }
    }

    function renderResult(v, copy, token) {
      const decision = evaluateAccess(v);
      const tone = decision === 'allowed' ? '#2E7D32' : decision === 'notFound' ? '#D32F2F' : '#F57C00';
      const icon = decision === 'allowed' ? '✓' : decision === 'notFound' ? '✕' : '⚠';
      const title = decision === 'allowed' ? 'Document Verified' : decision === 'notFound' ? 'Not Found' : 'Verification Issue';
      const message = decision === 'allowed'
        ? 'This document is authentic and valid.'
        : decision === 'notFound'
        ? 'No document matches this ID and token.'
        : 'This document has restrictions that prevent its use.';

      const remaining = v.max_uses != null ? Math.max(0, v.max_uses - (v.use_count || 0)) : null;
      const expired = v.expires_at ? new Date() > new Date(v.expires_at) : false;

      app.innerHTML = `
        <div class="header">
          <div class="icon" style="background: ${tone}">${icon}</div>
          <h1 style="color: ${tone}">${title}</h1>
          <p class="message">${message}</p>
        </div>
        <div class="details">
          <div class="row"><span class="label">Document Type</span><span class="value">${sentenceCase(v.document_type)}</span></div>
          <div class="row"><span class="label">Citizen Name</span><span class="value">${v.citizen_name || 'N/A'}</span></div>
          <div class="row"><span class="label">Status</span><span class="value"><span class="badge" style="background: ${tone}20; color: ${tone}">${sentenceCase(v.status)}</span></span></div>
          <div class="row"><span class="label">Issued</span><span class="value">${formatDate(v.issued_at)}</span></div>
          <div class="row"><span class="label">Expiry</span><span class="value">${v.expires_at ? formatDate(v.expires_at) : 'No expiry'}</span></div>
          <div class="row"><span class="label">Usage</span><span class="value">${v.single_use ? 'Single use' : 'Multi use'}</span></div>
          ${remaining !== null ? `<div class="row"><span class="label">Uses Remaining</span><span class="value">${remaining} of ${v.max_uses}</span></div>` : ''}
          ${copy ? `<div class="row"><span class="label">Print Copy</span><span class="value">${copy.serial || 'N/A'}</span></div>` : ''}
        </div>
        ${token && decision === 'allowed' ? '<button class="use-btn" id="useBtn" onclick="useDocument()">Mark as Used</button>' : ''}
        <div class="footer">Barangay Guion E-Document System</div>
      `;
    }

    async function useDocument() {
      const btn = document.getElementById('useBtn');
      btn.disabled = true;
      btn.textContent = 'Recording...';

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/document_verifications?document_id=eq.${documentId}&verification_token=eq.${token}`,
          {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=representation',
            },
            body: JSON.stringify({
              use_count: (verification.use_count || 0) + 1,
              used_at: new Date().toISOString(),
            }),
          }
        );

        if (res.ok) {
          btn.textContent = 'Document Used Successfully';
          btn.style.background = '#2E7D32';
        } else {
          const err = await res.json();
          btn.textContent = err.message || 'Error';
          btn.style.background = '#D32F2F';
        }
      } catch (e) {
        btn.textContent = 'Network Error';
        btn.style.background = '#D32F2F';
      }
    }

    loadVerification();
  </script>
</body>
</html>
