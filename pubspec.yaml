name: guin_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.7.5
environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.6

  # Push notifications (FCM). Android-only today — see lib/services/push_service.dart
  # and PUSH_NOTIFICATIONS.md. Every push call site degrades gracefully when the
  # Firebase config files are absent, so the app runs without a Firebase project.
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  
  # State Management
  provider: ^6.1.2
  
  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  cached_network_image: ^3.3.1
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.4
  
  # HTTP Client
  http: ^1.1.0
  
  # File Handling
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  file_picker: ^13.1.0
  # Share/save images via the system share sheet (official receipt download);
  # share_plus re-exports the XFile type used with ShareParams
  share_plus: ^13.3.1
  
  # External maps
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.3
  timezone: ^0.9.4
  flutter_dotenv: ^5.1.0
  
  # Security & Encryption
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  
  # UI Components
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  
  # Permissions
  permission_handler: ^11.3.1
  mobile_scanner: ^7.4.2
  camera: ^0.11.0+2
  pdfrx: ^2.4.8
  no_screenshot: ^2.0.1
  connectivity_plus: ^7.3.2

  # Maps & Location (no API keys; OpenStreetMap tiles)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1

  # reCAPTCHA widget (webview-based, cross-platform)
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
    background_color: "#ffffff"
    theme_color: "#0b3d91"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.jpg"

flutter:
  uses-material-design: true
  generate: true

  # Assets
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/captcha.html

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
