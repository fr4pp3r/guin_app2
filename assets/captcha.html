<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify you are human</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;margin:0;background:#f5f5f5;overflow:auto}.captcha-container{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);text-align:center;max-width:400px;width:90%}.captcha-container h2{margin-top:0;font-size:18px;color:#333}.captcha-container p{font-size:14px;color:#666;margin-bottom:16px}.g-recaptcha{margin:16px 0}.error{color:#d32f2f;font-size:13px;margin-top:12px;display:none}
  </style>
</head>
<body>
  <div class="captcha-container">
    <h2>Verify you are human</h2>
    <p>Please complete the reCAPTCHA to continue.</p>
    <div id="captcha-widget" class="g-recaptcha" data-sitekey="6LeceAIuAAAAAB9DGsQeWW4tjGviO_T6mNlChgsr" data-callback="onCaptchaSolved" data-expired-callback="onCaptchaExpired"></div>
    <div id="error" class="error">Verification failed. Please try again.</div>
  </div>
  <script>
    function onCaptchaSolved(token) {
      if (window.flutterChannel) {
        window.flutterChannel.postJSON({type: 'captcha_solved', token: token});
      }
    }
    function onCaptchaExpired() {
      if (window.flutterChannel) {
        window.flutterChannel.postJSON({type: 'captcha_error', msg: 'expired'});
      }
    }
  </script>
</body>
</html>
